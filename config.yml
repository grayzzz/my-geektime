server:
  app_name: My Geek Time
  run_mode: debug
  http_addr: 0.0.0.0
  http_port: 8090
jwt:
  secret: GKt8xR2mQp9vLfYw3nJb7Hs5Ac4De0Ui
  expires: 86400
i18n:
  directory: i18n
  default_lang: zh-CN
database:
  driver:  mysql   # mysql|postgres|sqlite
  source: root:gray@2026@tcp(127.0.0.1:3326)/mygeektime?charset=utf8mb4&parseTime=True&loc=Local&timeout=1000ms
  # source:  mygeektime.db
  # source: host=127.0.0.1 user=postgres password=postgres dbname=mygeektime port=5432 sslmode=disable TimeZone=Asia/Shanghai
  max_idle_conns: 20
  max_open_conns: 100
storage: 
  driver: local
  directory: repo  # Customize download folder, default to execute repo directory under the directory
  bucket: object
  host: http://127.0.0.1:8090  # Keep the port consistent with the http_port in the server
browser:
  open_browser: false # Automatically open browser after service startup
site:
  download: false
  cache: false
  register:
    types:
     - name
  login:
    types:
     - name 
    guest:
      name:
        account:
        password:
      email:
        account:
        password:
  play:
    type: origin  #  origin | local
    proxy_url:
      - https://res001.geekbang.org
      # - https://media001.geekbang.org
  proxy:
    cache: true
    cache_prefix: resource
    proxy_url: /v2/file/proxy?url={url}
    urls:
      - https://static001.geekbang.org/resource/image/*
      - https://static001.geekbang.org/account/avatar/*
      - https://static001.geekbang.org/files/resource/*
  email:
    smtp:
      host:
      port: 
      username: 
      password: 
      from: 

ai:  # AI 摘要与文章问答使用的 OpenAI 兼容服务配置（DeepSeek / Qwen / GLM 等）
     # 推荐在网页「设置页 → AI 服务」中填写并保存（会整体写入 custom_config.yaml 并即时生效）；
     # 无界面部署时也可直接在此填写后重启服务。
  base_url: ""  # API 根地址，一般以 /v1 结尾，如 https://api.deepseek.com/v1（勿带尾斜杠）
  api_key: ""   # 服务商密钥，如 sk-xxx；三项任一为空时 AI 功能不可用并提示先配置
  model: ""     # 模型名称，如 deepseek-chat / qwen-plus / glm-4
